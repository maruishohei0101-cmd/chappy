<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ご注文完了 | ACFIT JAPAN</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .thanks-container {
      max-width: 640px;
      margin: 120px auto 100px;
      padding: 60px 24px;
      text-align: center;
      background: #ffffff;
    }
    .thanks-en {
      font-size: 12px;
      letter-spacing: 0.25em;
      color: #888;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .thanks-title {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #1a1a1a;
      margin-bottom: 28px;
    }
    .thanks-text {
      font-size: 14px;
      line-height: 2;
      color: #444;
      margin-bottom: 44px;
    }
    .thanks-btn {
      display: inline-block;
      padding: 16px 48px;
      background: #1a1a1a;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.15em;
      transition: opacity 0.3s;
    }
    .thanks-btn:hover {
      opacity: 0.75;
    }
    @media (max-width: 767px) {
      .thanks-container {
        margin: 80px auto 60px;
        padding: 40px 20px;
      }
      .thanks-title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <main class="thanks-container">
    <p class="thanks-en">THANK YOU FOR YOUR ORDER</p>
    <h1 class="thanks-title">ご注文ありがとうございます</h1>
    <p class="thanks-text">
      決済が正常に完了いたしました。<br>
      ご登録いただいたメールアドレス宛に、Squareより決済完了メール（レシート）が送信されておりますのでご確認ください。<br><br>
      商品の発送準備が整い次第、順次発送させていただきます。
    </p>
    <a href="index.html" class="thanks-btn">トップページへ戻る</a>
  </main>

</body>
</html>
